<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fr.asw Style - Komik & Novel History</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR ATAS -->
    <nav class="navbar">
        <div class="nav-brand">
            <span class="logo-icon">⚡</span>
            <h1>History<span>All</span></h1>
        </div>
        <div class="nav-actions">
            <button id="btn-buka-tambah" class="btn-tambah-nav" style="display: none;">+ Tambah Komik</button>
            <div id="info-akun-nav" class="info-akun-nav" style="display: none;">
                <span id="teks-user"></span>
                <button id="btn-keluar" class="btn-logout">Keluar</button>
            </div>
            <button id="btn-buka-login" class="btn-login-nav">Masuk</button>
        </div>
    </nav>

    <!-- KONTEN UTAMA -->
    <main class="container">
        <!-- 2 Tab Halaman Utama Terpisah: Halaman Komik & Halaman Novel -->
        <div class="category-tabs">
            <button class="cat-btn active" data-kategori="Komik">📘 Halaman Komik</button>
            <button class="cat-btn" data-kategori="Novel">📖 Halaman Novel</button>
        </div>

        <section class="search-section">
            <div class="search-box">
                <input type="text" id="input-cari" placeholder="Cari judul komik di koleksimu...">
            </div>
            <div class="filter-tabs">
                <button class="filter-btn active" data-filter="Semua">Semua</button>
                <button class="filter-btn" data-filter="Sedang Dibaca">Reading</button>
                <button class="filter-btn" data-filter="Tamat">Completed</button>
                <button class="filter-btn" data-filter="Rencana Baca">Plan to Read</button>
            </div>
        </section>

        <!-- Form Tambah Komik / Novel -->
        <section id="panel-tambah" class="panel-tambah" style="display: none;">
            <div class="panel-header">
                <h2 id="judul-form-tambah">Tambah Komik Baru</h2>
                <button type="button" id="btn-tutup-tambah" class="btn-close-kecil">✕</button>
            </div>
            <form id="form-komik" class="form-grid">
                <div>
                    <label>Jenis Bacaan</label>
                    <select id="kategori">
                        <option value="Komik">📘 Komik (Manga / Manhwa / Manhua)</option>
                        <option value="Novel">📖 Novel (Light Novel / Web Novel)</option>
                    </select>
                </div>
                <div>
                    <label id="label-judul">Judul Komik</label>
                    <input type="text" id="judul" placeholder="Contoh: Solo Leveling" required>
                </div>
                <div id="wadah-volume" style="display: none;">
                    <label>Volume (Opsional)</label>
                    <input type="number" id="volume" placeholder="Contoh: 3 (Kosongkan jika tidak ada)" min="1">
                </div>
                <div>
                    <label>Chapter Terakhir</label>
                    <input type="number" id="chapter" placeholder="Contoh: 110" min="0" required>
                </div>
                <div>
                    <label>Status Baca</label>
                    <select id="status">
                        <option value="Sedang Dibaca">Sedang Dibaca (Reading)</option>
                        <option value="Tamat">Sudah Tamat (Completed)</option>
                        <option value="Rencana Baca">Rencana Baca (Plan)</option>
                    </select>
                </div>
                <div class="form-full">
                    <label id="label-sampul">Poster / Sampul Komik</label>
                    <input type="file" id="sampul" accept="image/*">
                    <div id="preview-sampul-wadah" class="preview-sampul-wadah" style="display: none;">
                        <img id="preview-sampul-img" src="" alt="Preview Poster">
                        <div class="preview-sampul-aksi">
                            <button type="button" id="btn-ubah-sampul-form" class="btn-ubah-sampul-form">🔄 Ganti Gambar Poster</button>
                            <button type="button" id="btn-hapus-sampul-form" class="btn-hapus-sampul-form">✕ Hapus</button>
                        </div>
                    </div>
                </div>
                <div class="form-full">
                    <button type="submit" id="btn-simpan-komik" class="btn-simpan-komik">Simpan ke Koleksi</button>
                </div>
            </form>
        </section>

        <div class="section-title">
            <h2 id="judul-daftar">Daftar Koleksi Komik</h2>
            <span id="total-komik" class="badge-total">0 Komik</span>
        </div>

        <div id="daftar-komik" class="shinigami-grid"></div>
        <!-- Input File Tersembunyi untuk Mengubah Poster Komik/Novel yang Sudah Disimpan -->
        <input type="file" id="input-ganti-sampul" accept="image/*" style="display: none;">
    </main>

    <!-- MODAL LOGIN -->
    <div id="modal-auth" class="modal-overlay">
        <div class="auth-card">
            <div class="auth-tabs">
                <button type="button" class="auth-tab" id="tab-social">Social</button>
                <button type="button" class="auth-tab active" id="tab-password">Password</button>
            </div>

            <!-- Konten Tab Password -->
            <div id="konten-password">
                <h2 id="judul-modal-auth" class="auth-title">Login with Password</h2>

                <form id="form-auth" autocomplete="off">
                    <div class="auth-input-group">
                        <input type="email" id="email-user" placeholder="Email" required>
                    </div>
                    <div class="auth-input-group">
                        <input type="password" id="password-user" placeholder="Password (min. 6 karakter)" required>
                    </div>

                    <p id="pesan-auth" class="pesan-auth"></p>

                    <button type="submit" id="btn-submit-auth" class="auth-submit-btn">Login</button>
                </form>

                <div class="auth-footer">
                    <p id="teks-bantuan-auth">Untuk mendapatkan password lihat tutorial ini:</p>
                    <a href="#" id="link-ganti-mode">Mengatur Password</a>
                </div>
            </div>

            <!-- Konten Tab Social (Login Google 1-Klik) -->
            <div id="konten-social" style="display: none; text-align: center; padding: 10px 0;">
                <h2 class="auth-title">Social Login</h2>
                <button type="button" id="btn-login-google" class="auth-submit-btn" style="margin-bottom: 12px;">
                    🌐 Masuk dengan Akun Google
                </button>
                <p style="color: #a1a1aa; font-size: 12px;">Aman & otomatis terhubung dengan akun Google-mu.</p>
            </div>
        </div>
    </div>

    <!-- Wajib menggunakan type="module" untuk Firebase -->
    <script type="module" src="app.js"></script>
</body>
</html>
