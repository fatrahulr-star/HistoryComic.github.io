<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HistorySaver - Komik, Novel, Buku & Soundtrack History</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR ATAS -->
    <nav class="navbar">
        <div class="nav-brand">
            <span class="logo-icon">⚡</span>
            <h1>History<span>Saver</span></h1>
        </div>
        <div class="nav-actions">
            <button id="btn-buka-tambah" class="btn-tambah-nav" style="display: none;">+ Tambah Komik</button>
            <div id="info-akun-nav" class="info-akun-nav" style="display: none;">
                <span id="teks-user"></span>
                <button id="btn-keluar" class="btn-logout">Keluar</button>
            </div>
            <button id="btn-buka-login" class="btn-login-nav">Masuk</button>
        </div>
    </nav>

    <!-- KONTEN UTAMA -->
    <main class="container">
        <!-- 4 Tab Utama: Komik, Novel (Bercabang: Light Novel & Novel Biasa), Buku Bacaan Biasa, dan Lagu / Soundtrack -->
        <div class="category-tabs">
            <button type="button" class="cat-btn active" id="tab-komik" data-kategori="Komik">📘 Komik</button>
            <button type="button" class="cat-btn" id="tab-novel" data-kategori="Novel">📖 Novel ▾</button>
            <button type="button" class="cat-btn" id="tab-buku" data-kategori="Buku Bacaan Biasa">📕 Buku Bacaan</button>
            <button type="button" class="cat-btn" id="tab-lagu" data-kategori="Lagu / Soundtrack">🎵 Lagu & Audio</button>
        </div>

        <!-- Cabang Pilihan Novel: Light Novel & Novel Biasa -->
        <div id="cabang-novel-bar" class="cabang-novel-bar" style="display: none;">
            <button type="button" class="sub-novel-btn active" data-subnovel="Light Novel">✨ Light Novel</button>
            <button type="button" class="sub-novel-btn" data-subnovel="Novel Biasa">📖 Novel Biasa</button>
        </div>

        <section class="search-section">
            <div class="search-box">
                <input type="text" id="input-cari" placeholder="Cari judul komik di koleksimu...">
            </div>
            <div class="filter-tabs">
                <button class="filter-btn active" id="filter-semua" data-filter="Semua">Semua</button>
                <button class="filter-btn" id="filter-reading" data-filter="Sedang Dibaca">Reading</button>
                <button class="filter-btn" id="filter-completed" data-filter="Tamat">Completed</button>
                <button class="filter-btn" id="filter-plan" data-filter="Rencana Baca">Plan to Read</button>
            </div>
        </section>

        <!-- Form Tambah Komik / Light Novel / Novel Biasa / Buku Bacaan Biasa / Lagu & Soundtrack -->
        <section id="panel-tambah" class="panel-tambah" style="display: none;">
            <div class="panel-header">
                <h2 id="judul-form-tambah">Tambah Komik Baru</h2>
                <button type="button" id="btn-tutup-tambah" class="btn-close-kecil">✕</button>
            </div>
            <form id="form-komik" class="form-grid">
                <div>
                    <label>Jenis Koleksi</label>
                    <select id="kategori">
                        <option value="Komik">📘 Komik (Manga / Manhwa / Manhua)</option>
                        <option value="Light Novel">✨ Light Novel (Web Novel / LN)</option>
                        <option value="Novel Biasa">📖 Novel Biasa</option>
                        <option value="Buku Bacaan Biasa">📕 Buku Bacaan Biasa</option>
                        <option value="Lagu / Soundtrack">🎵 Lagu / Soundtrack (Status Sosmed)</option>
                    </select>
                </div>
                <div>
                    <label id="label-judul">Judul Komik</label>
                    <input type="text" id="judul" placeholder="Contoh: Solo Leveling" required>
                </div>
                <div id="wadah-volume" style="display: none;">
                    <label>Volume (Opsional)</label>
                    <input type="number" id="volume" placeholder="Contoh: 3 (Kosongkan jika tidak ada)" min="1">
                </div>
                <div id="wadah-chapter">
                    <label>Chapter Terakhir</label>
                    <input type="number" id="chapter" placeholder="Contoh: 110" min="0" required>
                </div>
                <div id="wadah-halaman-buku" class="rentang-halaman-grid" style="display: none;">
                    <div>
                        <label>Dari Halaman</label>
                        <input type="number" id="halaman-awal" placeholder="Contoh: 1" min="1">
                    </div>
                    <div>
                        <label>Sampai Halaman</label>
                        <input type="number" id="halaman-akhir" placeholder="Contoh: 45" min="1">
                    </div>
                </div>

                <!-- Input Khusus Lagu / Soundtrack untuk Kebutuhan Status Sosmed -->
                <div id="wadah-lagu-sosmed" class="lagu-form-grid form-full" style="display: none;">
                    <div>
                        <label>Penyanyi / Artis / Sumber Sound</label>
                        <input type="text" id="artis-lagu" placeholder="Contoh: Alok / Radwimps / Sound IG & TikTok">
                    </div>
                    <div>
                        <label>Bagian / Timestamp Status (Opsional)</label>
                        <input type="text" id="timestamp-lagu" placeholder="Contoh: 0:45 - 1:15 (Bagian Reff / Drop)">
                    </div>
                    <div>
                        <label>Platform / Vibe Status Sosmed</label>
                        <select id="platform-lagu">
                            <option value="Semua Sosmed">📱 Semua Sosmed (IG / WA / TikTok)</option>
                            <option value="Instagram Story / Reels">📸 Instagram Story / Reels</option>
                            <option value="TikTok Sound">🎵 TikTok Sound</option>
                            <option value="WhatsApp Status">💬 WhatsApp Status</option>
                            <option value="YouTube Shorts">🎬 YouTube Shorts</option>
                            <option value="Vibe Aesthetic / Chill">✨ Vibe Aesthetic / Chill / Malam</option>
                            <option value="Vibe Hype / Anime / Gaming">🔥 Vibe Hype / Anime / Gaming</option>
                        </select>
                    </div>
                    <div>
                        <label>Link Audio / Lagu (Opsional)</label>
                        <input type="url" id="link-lagu" placeholder="https://open.spotify.com/... atau YouTube/IG/TikTok">
                    </div>
                    <div class="form-full">
                        <label>Catatan / Ide Story atau Lirik Singkat (Opsional)</label>
                        <input type="text" id="catatan-lagu" placeholder="Contoh: Cocok buat story pemandangan sore / perjalanan jauh">
                    </div>
                </div>

                <div>
                    <label id="label-status">Status Baca</label>
                    <select id="status">
                        <option value="Sedang Dibaca" id="opt-status-reading">Sedang Dibaca (Reading)</option>
                        <option value="Tamat" id="opt-status-completed">Sudah Tamat (Completed)</option>
                        <option value="Rencana Baca" id="opt-status-plan">Rencana Baca (Plan)</option>
                    </select>
                </div>
                <div class="form-full">
                    <label id="label-sampul">Poster / Sampul Komik</label>
                    <input type="file" id="sampul" accept="image/*">
                    <div id="preview-sampul-wadah" class="preview-sampul-wadah" style="display: none;">
                        <img id="preview-sampul-img" src="" alt="Preview Poster">
                        <div class="preview-sampul-aksi">
                            <button type="button" id="btn-ubah-sampul-form" class="btn-ubah-sampul-form">🔄 Ganti Gambar Poster</button>
                            <button type="button" id="btn-hapus-sampul-form" class="btn-hapus-sampul-form">✕ Hapus</button>
                        </div>
                    </div>
                </div>
                <div class="form-full">
                    <button type="submit" id="btn-simpan-komik" class="btn-simpan-komik">Simpan ke Koleksi</button>
                </div>
            </form>
        </section>

        <!-- Showcase Koleksi Audio 2x2 ala Saved Collection (Khusus Tab Lagu / Soundtrack) -->
        <section id="showcase-audio-wadah" class="showcase-audio-wadah" style="display: none;"></section>

        <div class="section-title">
            <h2 id="judul-daftar">Daftar Koleksi Komik</h2>
            <span id="total-komik" class="badge-total">0 Komik</span>
        </div>

        <div id="daftar-komik" class="shinigami-grid"></div>
        <!-- Input File Tersembunyi untuk Mengubah Poster Komik/Novel/Lagu yang Sudah Disimpan -->
        <input type="file" id="input-ganti-sampul" accept="image/*" style="display: none;">
    </main>

    <!-- MODAL EDIT NAMA & TAMBAHAN CHAPTER / HALAMAN / INFO LAGU -->
    <div id="modal-edit" class="modal-overlay" style="display: none;">
        <div class="auth-card edit-card">
            <div class="panel-header" style="margin-bottom: 16px;">
                <h2 id="judul-modal-edit" class="auth-title" style="margin-bottom: 0; font-size: 19px; text-align: left;">Edit Komik</h2>
                <button type="button" id="btn-tutup-edit" class="btn-close-kecil">✕</button>
            </div>
            <form id="form-edit-info" autocomplete="off">
                <div class="edit-field-group">
                    <label id="label-edit-judul">Nama / Judul Komik</label>
                    <input type="text" id="input-edit-judul" placeholder="Masukkan judul..." required>
                </div>
                <!-- Untuk Komik, Light Novel & Novel Biasa (Chapter) -->
                <div id="grup-edit-chapter" class="edit-field-group">
                    <label>Tambahan Chapter yang Sudah Dibaca</label>
                    <input type="number" id="input-tambah-chapter" placeholder="Contoh: 5 (Ketik 0 jika tidak menambah)" value="0" min="0">
                    <div class="info-kalkulasi-ch">
                        <span>Chapter saat ini: <strong id="teks-ch-lama">0</strong></span>
                        <span>➔</span>
                        <span>Menjadi: <strong id="teks-ch-baru" class="highlight-ch">0</strong></span>
                    </div>
                </div>
                <!-- Untuk Buku Bacaan Biasa (Dari Halaman ... Sampai Halaman ...) -->
                <div id="grup-edit-halaman" class="edit-field-group" style="display: none;">
                    <div class="rentang-halaman-edit">
                        <div>
                            <label>Dari Halaman</label>
                            <input type="number" id="edit-halaman-awal" placeholder="Contoh: 1" min="1">
                        </div>
                        <div>
                            <label>Sampai Halaman</label>
                            <input type="number" id="edit-halaman-akhir" placeholder="Contoh: 50" min="1">
                        </div>
                    </div>
                    <label style="margin-top: 12px;">Atau Tambah Halaman yang Baru Dibaca (+ Halaman)</label>
                    <input type="number" id="input-tambah-halaman" placeholder="Contoh: 10 (Otomatis menambah halaman akhir)" value="0" min="0">
                    <div class="info-kalkulasi-ch">
                        <span>Rentang Halaman:</span>
                        <strong id="teks-hal-preview" class="highlight-ch">Hal. 1 - 1</strong>
                    </div>
                </div>
                <!-- Untuk Lagu / Soundtrack Status Sosmed -->
                <div id="grup-edit-lagu" class="edit-field-group" style="display: none;">
                    <div class="edit-field-group">
                        <label>Penyanyi / Artis / Sumber Sound</label>
                        <input type="text" id="edit-artis-lagu" placeholder="Contoh: Alok / Radwimps / Sound TikTok">
                    </div>
                    <div class="rentang-halaman-edit" style="margin-bottom: 12px;">
                        <div>
                            <label>Bagian / Detik Status</label>
                            <input type="text" id="edit-timestamp-lagu" placeholder="Contoh: 0:45 - 1:15">
                        </div>
                        <div>
                            <label>Platform / Vibe</label>
                            <select id="edit-platform-lagu">
                                <option value="Semua Sosmed">📱 Semua Sosmed</option>
                                <option value="Instagram Story / Reels">📸 IG Story / Reels</option>
                                <option value="TikTok Sound">🎵 TikTok Sound</option>
                                <option value="WhatsApp Status">💬 WhatsApp Status</option>
                                <option value="YouTube Shorts">🎬 YouTube Shorts</option>
                                <option value="Vibe Aesthetic / Chill">✨ Vibe Aesthetic / Chill</option>
                                <option value="Vibe Hype / Anime / Gaming">🔥 Vibe Hype / Anime</option>
                            </select>
                        </div>
                    </div>
                    <div class="edit-field-group">
                        <label>Link Audio / Lagu (Opsional)</label>
                        <input type="url" id="edit-link-lagu" placeholder="https://open.spotify.com/... atau link video/sound">
                    </div>
                    <div class="edit-field-group">
                        <label>Catatan / Ide Story (Opsional)</label>
                        <input type="text" id="edit-catatan-lagu" placeholder="Contoh: Cocok buat story malam hari">
                    </div>
                    <div class="edit-field-group" style="margin-bottom: 4px;">
                        <label>Status Pemakaian Audio</label>
                        <select id="edit-status-lagu">
                            <option value="Sedang Dibaca">🎧 Favorit / Sering Dipakai (On Repeat)</option>
                            <option value="Rencana Baca">📌 Siap Dipakai Status (Saved)</option>
                            <option value="Tamat">✅ Sudah Dipakai di Status (Used)</option>
                        </select>
                    </div>
                </div>
                <button type="submit" id="btn-simpan-edit" class="btn-simpan-komik" style="margin-top: 8px;">Simpan Perubahan</button>
            </form>
        </div>
    </div>

    <!-- MODAL LOGIN -->
    <div id="modal-auth" class="modal-overlay">
        <div class="auth-card">
            <div class="auth-tabs">
                <button type="button" class="auth-tab" id="tab-social">Social</button>
                <button type="button" class="auth-tab active" id="tab-password">Password</button>
            </div>

            <!-- Konten Tab Password -->
            <div id="konten-password">
                <h2 id="judul-modal-auth" class="auth-title">Login with Password</h2>

                <form id="form-auth" autocomplete="off">
                    <div class="auth-input-group">
                        <input type="email" id="email-user" placeholder="Email" required>
                    </div>
                    <div class="auth-input-group">
                        <input type="password" id="password-user" placeholder="Password (min. 6 karakter)" required>
                    </div>

                    <p id="pesan-auth" class="pesan-auth"></p>

                    <button type="submit" id="btn-submit-auth" class="auth-submit-btn">Login</button>
                </form>

                <div class="auth-footer">
                    <p id="teks-bantuan-auth">Untuk mendapatkan password lihat tutorial ini:</p>
                    <a href="#" id="link-ganti-mode">Mengatur Password</a>
                </div>
            </div>

            <!-- Konten Tab Social (Login Google 1-Klik) -->
            <div id="konten-social" style="display: none; text-align: center; padding: 10px 0;">
                <h2 class="auth-title">Social Login</h2>
                <button type="button" id="btn-login-google" class="auth-submit-btn" style="margin-bottom: 12px;">
                    🌐 Masuk dengan Akun Google
                </button>
                <p style="color: #a1a1aa; font-size: 12px;">Aman & otomatis terhubung dengan akun Google-mu.</p>
            </div>
        </div>
    </div>

    <!-- Wajib menggunakan type="module" untuk Firebase -->
    <script type="module" src="app.js"></script>
</body>
</html>
